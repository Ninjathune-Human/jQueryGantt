name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Déploiement
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Tag deploye sur le commit publié
        run: |
          git tag -f deploye "$GITHUB_SHA"
          git push -f origin refs/tags/deploye
